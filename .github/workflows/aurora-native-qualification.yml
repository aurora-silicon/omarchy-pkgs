name: Native Aurora package qualification
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated AArch64 package directories
        required: true
        default: linux-aurora
permissions:
  contents: read
concurrency:
  group: aurora-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          names = os.environ['PACKAGES'].split()
          assert names and len(names) == len(set(names))
          assert all(re.fullmatch(r'[a-z0-9][a-z0-9+_.-]*', name) and
                     Path('pkgbuilds', name, 'PKGBUILD').is_file() for name in names)
          print('packages=' + json.dumps(names))
          PY
  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check native build host
        run: |
          test "$(uname -m)" = aarch64
          df -B1 .
          test "$(df -B1 --output=avail . | tail -1)" -gt 32212254720
      - name: Build with the normal package recipe
        env:
          CONTAINER_ENGINE: docker
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          bin/build --mirror edge --arch aarch64 --package "$PACKAGE" 2>&1 | tee build.log
      - name: Pack qualified artifact
        id: artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          source helpers/artifact-helpers.sh
          pack_packages build-output/edge/aarch64 packages.tar
          sha256sum packages.tar > packages.tar.sha256
          echo "tree=$(git rev-parse "HEAD:pkgbuilds/$PACKAGE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-aarch64-${{ steps.artifact.outputs.tree }}
          path: |
            packages.tar
            packages.tar.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-logs-${{ matrix.package }}
          path: |
            build.log
            src/**/build/base/vmlinux
          if-no-files-found: ignore
          retention-days: 30
